name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # required for createWorkflowDispatch (trigger image build after merge)
  issues: write    # required to open the manual-merge-required issue on a genuine conflict

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/bastillion-io/Bastillion.git || true
          git fetch upstream
      
      - name: Check for updates
        id: check
        run: |
          # Check if there are commits in upstream/main that aren't in main
          # This accounts for diverged histories and cherry-picks
          COMMITS_TO_MERGE=$(git rev-list --count HEAD..upstream/main)
          
          if [ "$COMMITS_TO_MERGE" -eq 0 ]; then
            echo "No new commits to merge from upstream"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Found $COMMITS_TO_MERGE commits to merge from upstream"
            LATEST_UPSTREAM=$(git rev-parse upstream/main)
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "upstream_sha=${LATEST_UPSTREAM:0:7}" >> $GITHUB_OUTPUT
            echo "commits_count=$COMMITS_TO_MERGE" >> $GITHUB_OUTPUT
          fi
      
      - name: Create sync branch
        if: steps.check.outputs.has_updates == 'true'
        run: |
          BRANCH_NAME="sync-upstream-${{ steps.check.outputs.upstream_sha }}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
      
      - name: Merge upstream changes
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          # Merge with strategy to keep our workflows
          FORK_HEAD=$(git rev-parse HEAD)
          MERGE_OK=0
          if git merge upstream/main --no-edit -X ours; then
            MERGE_OK=1
          else
            # .github/workflows/ is fork-owned (see the post-merge checkout
            # below) - but -X ours only resolves conflicts in files BOTH sides
            # modified. A file we deleted that upstream still edits is a
            # modify/delete conflict, which -X ours cannot touch, so the merge
            # aborts every run. (This is exactly what silently broke the sync
            # from 2026-08-26 to 2026-09-12: upstream kept editing
            # .github/workflows/github-build.yml, which we intentionally
            # removed early on.) Auto-resolve any conflict confined to
            # .github/workflows/ by keeping our side, then finish the merge.
            # Anything else is a genuine conflict and falls through to the
            # manual-merge-required path below.
            REAL_CONFLICT=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                .github/workflows/*)
                  if git cat-file -e "$FORK_HEAD:$f" 2>/dev/null; then
                    git checkout "$FORK_HEAD" -- "$f"
                    git add "$f"
                  else
                    git rm -f -- "$f" >/dev/null
                  fi
                  ;;
                *)
                  REAL_CONFLICT=1
                  ;;
              esac
            done <<< "$(git diff --name-only --diff-filter=U)"

            if [ "$REAL_CONFLICT" -eq 0 ]; then
              git commit --no-edit
              MERGE_OK=1
            else
              git merge --abort
            fi
          fi

          if [ "$MERGE_OK" -eq 1 ]; then
            # Restore our workflows directory exactly as it was before this
            # merge - including removing any workflow file upstream added that
            # we never had. A plain 'checkout HEAD' would be a no-op here:
            # by this point HEAD already IS the merge commit, so it just
            # re-materializes what's already committed. --no-overlay against
            # the saved pre-merge commit is what actually restores our state
            # and deletes any newly-added path a plain overlay checkout would
            # otherwise silently leave in place.
            git checkout --no-overlay "$FORK_HEAD" -- .github/workflows/

            # Check if merge created any commits
            COMMITS_AHEAD=$(git rev-list --count origin/main..HEAD)
            if [ "$COMMITS_AHEAD" -gt 0 ]; then
              # Amend the merge commit to include workflow exclusion
              git commit --amend --no-edit
              echo "merge_status=success" >> $GITHUB_OUTPUT
              echo "has_conflicts=false" >> $GITHUB_OUTPUT
              echo "has_commits=true" >> $GITHUB_OUTPUT
            else
              echo "merge_status=no_changes" >> $GITHUB_OUTPUT
              echo "has_conflicts=false" >> $GITHUB_OUTPUT
              echo "has_commits=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "has_commits=false" >> $GITHUB_OUTPUT
          fi

      - name: Open conflict issue if unresolved
        # A genuine conflict (outside .github/workflows/) leaves has_commits
        # false, so the Push/Create-PR steps below never run - previously that
        # meant the failure was completely silent (no PR, no notification),
        # which is how the sync going stale went unnoticed for weeks. Surface
        # it instead. Dedupes on a fixed label so re-runs don't spam issues.
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.has_conflicts == 'true'
        uses: actions/github-script@v9
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
          COMMITS_COUNT: ${{ steps.check.outputs.commits_count }}
        with:
          script: |
            // The label must exist before it can be used to create or filter
            // issues (POST /issues 422s on an unknown label). Create it if
            // missing; ignore 422 if another run created it concurrently.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'upstream-sync-conflict',
                color: 'd73a4a',
                description: 'Automated upstream sync could not merge cleanly',
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync-conflict',
            });
            if (existing.data.length > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream sync blocked: manual merge required',
              labels: ['upstream-sync-conflict'],
              body: `The automated upstream sync could not merge cleanly and needs manual resolution.\n\n` +
                `**Upstream commit:** ${process.env.UPSTREAM_SHA}\n` +
                `**Commits pending:** ${process.env.COMMITS_COUNT}\n\n` +
                `Locally: \`git fetch upstream main && git merge upstream/main -X ours\`, resolve the conflict, ` +
                `then open a PR to \`main\`. Close this issue once resolved (it will reopen on the next conflicting run).`,
            });

      - name: Push sync branch
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.has_commits == 'true'
        run: |
          git push origin "${{ env.branch_name }}"
      
      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.has_commits == 'true'
        id: create_pr
        uses: actions/github-script@v9
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
          MERGE_STATUS: ${{ steps.merge.outputs.merge_status }}
          HAS_CONFLICTS: ${{ steps.merge.outputs.has_conflicts }}
        with:
          script: |
            const hasConflicts = process.env.HAS_CONFLICTS === 'true';
            const statusMessage = hasConflicts 
              ? '⚠️ **Manual merge required** - conflicts detected'
              : '✅ Clean merge - will auto-merge after tests pass';
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync upstream changes (${process.env.UPSTREAM_SHA})`,
              head: '${{ env.branch_name }}',
              base: 'main',
              body: `## Upstream Sync
              
              This PR syncs changes from [bastillion-io/Bastillion](https://github.com/bastillion-io/Bastillion).
              
              **Upstream commit:** ${process.env.UPSTREAM_SHA}
              **Merge status:** ${process.env.MERGE_STATUS}
              **Has conflicts:** ${process.env.HAS_CONFLICTS}
              
              ${statusMessage}
              `
            });
            return pr.number;
      
      - name: Enable auto-merge
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.has_commits == 'true' && steps.merge.outputs.has_conflicts == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = ${{ steps.create_pr.outputs.result }};
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'merge'
            });

      - name: Trigger image build for the merged sync
        # The merge above uses GITHUB_TOKEN, so its push does NOT trigger the
        # `push`-based Build and Push Docker Image workflow (GitHub suppresses
        # recursive GITHUB_TOKEN runs). Dispatch it explicitly so the published
        # image actually picks up the synced upstream changes. workflow_dispatch
        # is exempt from that suppression, so this run does fire.
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.has_commits == 'true' && steps.merge.outputs.has_conflicts == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-image.yml',
              ref: 'main',
            });
